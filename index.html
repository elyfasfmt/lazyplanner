<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lazyplanner — Login</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; margin: 0;
    background: #f7f7f8; color: #1a1a1a;
    gap: 12px; text-align: center;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: #0f6cbd; color: #fff;
    font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  p { color: #5f5f5f; font-size: 14px; }
</style>
</head>
<body>
<div class="logo">LP</div>
<strong>Lazyplanner</strong>
<p>Login berhasil, halaman ini akan menutup otomatis...</p>

<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const errorDesc = params.get('error_description');

    if (window.opener) {
      window.opener.postMessage({
        type: 'lp-auth-code',
        code: code || null,
        state: state || null,
        error: error ? (errorDesc || error) : null,
      }, '*');
      setTimeout(() => window.close(), 500);
    } else {
      document.querySelector('p').textContent =
        'Silakan tutup halaman ini dan kembali ke Figma.';
    }
  })();
</script>
</body>
</html>
